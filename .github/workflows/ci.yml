name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Checks and rendering are pure functions of the registry, so the whole
    # suite runs without GPUs, model files, oneAPI, or a running proxy.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q  # includes shellcheck of the generated scripts (preinstalled on the runner)
